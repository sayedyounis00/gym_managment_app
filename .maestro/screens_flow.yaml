appId: com.example.gym_managment_app
---
- launchApp:
    clearState: false

# 1. Dashboard
- extendedWaitUntil:
    visible: "لوحة التحكم"
    timeout: 15000
- takeScreenshot: screenshots/maestro/01_dashboard

# 2. Notifications Screen
- tapOn:
    point: "88%,7%" # Top notifications icon
- waitForAnimationToEnd
- takeScreenshot: screenshots/maestro/02_notifications
- back

# 3. Settings Screen
- tapOn:
    point: "95%,7%" # Top settings icon
- waitForAnimationToEnd
- takeScreenshot: screenshots/maestro/03_settings
- back

# 4. Members Screen
- tapOn: "الأعضاء"
- waitForAnimationToEnd
- takeScreenshot: screenshots/maestro/04_members_list

# 5. Memberships / Packages Screen
- tapOn: "الباقات"
- waitForAnimationToEnd
- takeScreenshot: screenshots/maestro/05_packages_list

# 6. Finance Screen
- tapOn: "المالية"
- waitForAnimationToEnd
- takeScreenshot: screenshots/maestro/06_finance_overview
