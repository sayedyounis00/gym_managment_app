name: gym_managment_app
description: "Gym management mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  csv: ^8.0.0
  cupertino_icons: ^2.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.0.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  font_awesome_flutter: ^11.0.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  material_symbols_icons: ^4.2960.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  share_plus: ^13.3.1
  simple_clean_navbar: ^1.1.1
  skeletonizer: ^3.0.0
  table_calendar: ^3.3.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  bloc_test: ^9.0.3 # Testing utilities for Bloc/Cubit

  # Code Generation
  build_runner: ^2.16.1 # Build tool for code generators
  drift_dev: ^2.35.1 # Generator for Drift SQLite tables/queries

  # Linting & Code Quality
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0 # Recommended Flutter lint rules
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1 # Code generator for immutable data models
  injectable_generator: ^3.1.3 # Generator for GetIt / Injectable
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1 # Generator for JSON serialization
  mocktail: ^1.0.5 # Null-safe mocking library

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/spear-gym-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/spear-gym-logo-adaptive.png"
